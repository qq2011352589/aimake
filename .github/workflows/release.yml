name: release

# 触发：推送 v* tag（如 v0.1.0）→ 构建 + 发布 Release
# 说明：Nuitka 不支持跨平台交叉编译 → matrix 每平台原生构建（并行）
# 资产命名：aimake-<os>-<arch>（install.sh 按平台匹配下载）
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}  # 手动触发（仅构建 artifact，不发布）

permissions:
  contents: write

jobs:
  build-native:
    name: 构建 ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: aimake-linux-x86_64
          - os: macos-latest            # runner 原生为 arm64
            asset: aimake-darwin-aarch64
          - os: windows-latest
            asset: aimake-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 安装 Nuitka
        run: pip install nuitka zstandard ordered-set

      - name: 编译（Nuitka onefile）
        env:
          NUITKA_CACHE_DIR: ${{ runner.temp }}/nuitka
        # --assume-yes-for-downloads：Windows 自动下载 Dependency Walker（CI 无人值守必需）
        run: python -m nuitka --standalone --onefile --assume-yes-for-downloads main.py

      - name: 重命名为资产名
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv main.exe "${{ matrix.asset }}"
          else
            mv main.bin "${{ matrix.asset }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

      - name: 发布 Release 附件
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true

  # Linux ARM64：ubuntu runner + qemu 模拟 arm64 容器原生编译
  # 注意：产物为 glibc 版，供 ARM Linux 服务器（树莓派等）；Termux 不可用
  build-linux-arm64:
    name: 构建 aimake-linux-aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 注册 qemu binfmt（arm64 容器可执行）
        uses: docker/setup-qemu-action@v3

      - name: qemu 容器内编译（linux/arm64）
        run: |
          docker run --platform linux/arm64 --rm -v "$PWD":/work -w /work \
            python:3.14-slim bash -c \
            "apt-get update -qq && apt-get install -y -qq patchelf binutils && \
             pip install --quiet nuitka zstandard ordered-set && \
             python -m nuitka --standalone --onefile --assume-yes-for-downloads main.py && \
             mv main.bin aimake-linux-aarch64"

      - uses: actions/upload-artifact@v4
        with:
          name: aimake-linux-aarch64
          path: aimake-linux-aarch64
          if-no-files-found: error

      - name: 发布 Release 附件
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: aimake-linux-aarch64
          generate_release_notes: true

  # Termux 四架构：termux/termux-docker 容器（bionic libc）内原生编译
  # 注意：产物为 bionic 版，供 Android/Termux 使用（与上方 glibc 版不可互换）
  # Termux 包管理器禁 root → 容器内以 system 用户跑 pkg/pip（termux-docker 默认 entrypoint 已降权）
  build-termux:
    name: 构建 aimake-termux-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: arm
            platform: linux/arm/v7
          - arch: x86_64
            platform: linux/amd64
          - arch: i686
            platform: linux/386
    steps:
      - uses: actions/checkout@v4

      - name: 注册 qemu binfmt（非 x86_64 容器可执行）
        uses: docker/setup-qemu-action@v3

      - name: Termux 容器内编译（${{ matrix.platform }}）
        run: |
          # 挂载卷属主为 root，Termux 容器以 system 用户运行且禁 root
          # → 先复制到容器内 $HOME（可写），编译完成后拷回
          docker run --platform ${{ matrix.platform }} --rm \
            -v "$PWD":/home/builder/project \
            termux/termux-docker:${{ matrix.arch }} bash -c \
            "set -e
             pkg update -y
             pkg install -y python binutils patchelf ccache termux-elf-cleaner
             pip install nuitka zstandard ordered-set
             cp -r /home/builder/project /home/builder/work
             cd /home/builder/work
             python -m nuitka --standalone --onefile --assume-yes-for-downloads main.py
             cp main.bin /home/builder/project/aimake-termux-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: aimake-termux-${{ matrix.arch }}
          path: aimake-termux-${{ matrix.arch }}
          if-no-files-found: error

      - name: 发布 Release 附件
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: aimake-termux-${{ matrix.arch }}
          generate_release_notes: true
